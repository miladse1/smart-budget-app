<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BudgetFlow</title>
    <meta name="description" content="See what is left to spend this month. BudgetFlow reads your bank transactions and tracks each category against its monthly budget." />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="application-name" content="BudgetFlow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BudgetFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Resolve the theme before first paint so there is no light flash in dark mode.
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("budgetflow.theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0b100d" : "#faf9f5");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
